{% extends "base.html" %}
{% block title %}Edit Trade - {{ site_name }}{% endblock %}

{% block content %}

<!-- HERO -->
<section class="py-10 lg:py-14 relative scene-3d overflow-hidden">
  <div class="absolute inset-0 hero-grid-bg -z-30"></div>
  <div class="absolute inset-0 bg-gradient-to-br from-white via-brand-green-50/30 to-brand-green-100/20 -z-20"></div>
  <div class="hero-orb hero-orb-1 -z-10 opacity-60"></div>

  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 relative">
    <a href="{{ url_for('journal.list_entries') }}" class="inline-flex items-center gap-1.5 text-sm text-brand-green-800 hover:text-brand-green-900 font-bold mb-4">
      <span>←</span> Back to journal
    </a>
    <span class="chip-premium mb-3 inline-flex">
      <span class="live-dot"></span>
      <span>Edit Entry</span>
    </span>
    <h1 class="text-3xl sm:text-4xl font-black tracking-tight text-black mt-1">
      Edit <span class="gradient-shimmer">trade</span>
    </h1>
    <p class="text-gray-600 mt-2">Update the details and re-save.</p>
  </div>
</section>

<!-- FORM -->
<section class="pb-12 relative">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    <form method="POST" class="space-y-5">

      <!-- Trade basics -->
      <div class="glass-card p-5 lg:p-6 reveal-3d">
        <div class="flex items-center gap-2 mb-4">
          <div class="icon-premium" style="width:1.75rem;height:1.75rem;border-radius:0.5rem;">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
          </div>
          <p class="text-[10px] uppercase tracking-[0.2em] text-brand-green-700 font-black">Trade Details</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold mb-1.5 text-brand-green-900 uppercase tracking-wider">Trade Date *</label>
            <input type="date" name="trade_date" required value="{{ today }}" class="w-full px-4 py-2.5 bg-white border-2 border-gray-200 rounded-lg text-sm focus:border-brand-green-700 focus:outline-none transition font-semibold">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1.5 text-brand-green-900 uppercase tracking-wider">Symbol *</label>
            <input type="text" name="symbol" required placeholder="NQ, ES, CL" class="w-full px-4 py-2.5 bg-white border-2 border-gray-200 rounded-lg text-sm focus:border-brand-green-700 focus:outline-none transition font-mono font-bold">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1.5 text-brand-green-900 uppercase tracking-wider">Direction *</label>
            <div class="grid grid-cols-2 gap-1.5">
              <label class="cursor-pointer">
                <input type="radio" name="direction" value="LONG" required class="peer sr-only" checked>
                <div class="px-3 py-2.5 text-center text-sm font-black uppercase tracking-wider border-2 border-gray-200 rounded-lg peer-checked:border-brand-green-700 peer-checked:bg-brand-green-50 peer-checked:text-brand-green-800 hover:border-brand-green-300 transition-all">📈 Long</div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="direction" value="SHORT" required class="peer sr-only">
                <div class="px-3 py-2.5 text-center text-sm font-black uppercase tracking-wider border-2 border-gray-200 rounded-lg peer-checked:border-red-700 peer-checked:bg-red-50 peer-checked:text-red-700 hover:border-red-300 transition-all">📉 Short</div>
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- Prices -->
      <div class="glass-card p-5 lg:p-6 reveal-3d" style="animation-delay: 0.1s">
        <div class="flex items-center gap-2 mb-4">
          <div class="icon-premium" style="width:1.75rem;height:1.75rem;border-radius:0.5rem;">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </div>
          <p class="text-[10px] uppercase tracking-[0.2em] text-brand-green-700 font-black">Prices & P&L</p>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div>
            <label class="block text-xs font-bold mb-1.5 text-brand-green-900 uppercase tracking-wider">Entry *</label>
            <input type="number" step="0.01" name="entry_price" required class="w-full px-4 py-2.5 bg-white border-2 border-gray-200 rounded-lg text-sm focus:border-brand-green-700 focus:outline-none transition font-mono font-bold">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1.5 text-brand-green-900 uppercase tracking-wider">Exit *</label>
            <input type="number" step="0.01" name="exit_price" required class="w-full px-4 py-2.5 bg-white border-2 border-gray-200 rounded-lg text-sm focus:border-brand-green-700 focus:outline-none transition font-mono font-bold">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1.5 text-brand-green-900 uppercase tracking-wider">Stop Loss</label>
            <input type="number" step="0.01" name="stop_loss" class="w-full px-4 py-2.5 bg-white border-2 border-gray-200 rounded-lg text-sm focus:border-brand-green-700 focus:outline-none transition font-mono">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1.5 text-brand-green-900 uppercase tracking-wider">Take Profit</label>
            <input type="number" step="0.01" name="take_profit" class="w-full px-4 py-2.5 bg-white border-2 border-gray-200 rounded-lg text-sm focus:border-brand-green-700 focus:outline-none transition font-mono">
          </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4">
          <div>
            <label class="block text-xs font-bold mb-1.5 text-brand-green-900 uppercase tracking-wider">Contracts *</label>
            <input type="number" name="contracts" required min="1" value="1" class="w-full px-4 py-2.5 bg-white border-2 border-gray-200 rounded-lg text-sm focus:border-brand-green-700 focus:outline-none transition font-bold">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1.5 text-brand-green-900 uppercase tracking-wider">Net P&L ($) *</label>
            <input type="number" step="0.01" name="pnl" required class="w-full px-4 py-2.5 bg-white border-2 border-gray-200 rounded-lg text-sm focus:border-brand-green-700 focus:outline-none transition font-mono font-bold">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1.5 text-brand-green-900 uppercase tracking-wider">Fees ($)</label>
            <input type="number" step="0.01" name="fees" value="0" class="w-full px-4 py-2.5 bg-white border-2 border-gray-200 rounded-lg text-sm focus:border-brand-green-700 focus:outline-none transition font-mono">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1.5 text-brand-green-900 uppercase tracking-wider">Prop Firm</label>
            <select name="prop_firm_id" class="w-full px-4 py-2.5 bg-white border-2 border-gray-200 rounded-lg text-sm focus:border-brand-green-700 focus:outline-none transition font-semibold">
              <option value="">— None —</option>
              {% for f in firms %}
                <option value="{{ f.id }}">{{ f.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
      </div>

      <!-- Strategy & quality -->
      <div class="glass-card p-5 lg:p-6 reveal-3d" style="animation-delay: 0.15s">
        <div class="flex items-center gap-2 mb-4">
          <div class="icon-premium" style="width:1.75rem;height:1.75rem;border-radius:0.5rem;">
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
          </div>
          <p class="text-[10px] uppercase tracking-[0.2em] text-brand-green-700 font-black">Strategy & Edge</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold mb-1.5 text-brand-green-900 uppercase tracking-wider">Strategy</label>
            <input type="text" name="strategy" placeholder="e.g. Breakout" class="w-full px-4 py-2.5 bg-white border-2 border-gray-200 rounded-lg text-sm focus:border-brand-green-700 focus:outline-none transition font-semibold">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1.5 text-brand-green-900 uppercase tracking-wider">Setup Quality (1-5)</label>
            <select name="setup_quality" class="w-full px-4 py-2.5 bg-white border-2 border-gray-200 rounded-lg text-sm focus:border-brand-green-700 focus:outline-none transition font-semibold">
              <option value="1">1 - Poor</option>
              <option value="2">2 - Below average</option>
              <option value="3" selected>3 - Average</option>
              <option value="4">4 - Good</option>
              <option value="5">5 - A+ Setup</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold mb-1.5 text-brand-green-900 uppercase tracking-wider">Followed Plan?</label>
            <div class="flex items-center gap-3 mt-3">
              <label class="cursor-pointer flex items-center gap-2">
                <input type="radio" name="followed_plan" value="1" checked class="w-4 h-4 text-brand-green-700 focus:ring-brand-green-700">
                <span class="text-sm font-bold text-brand-green-900">✓ Yes</span>
              </label>
              <label class="cursor-pointer flex items-center gap-2">
                <input type="radio" name="followed_plan" value="0" class="w-4 h-4 text-red-700 focus:ring-red-500">
                <span class="text-sm font-bold text-gray-600">✗ No</span>
              </label>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-4">
          <div>
            <label class="block text-xs font-bold mb-1.5 text-brand-green-900 uppercase tracking-wider">Emotion Before</label>
            <select name="emotion_before" class="w-full px-4 py-2.5 bg-white border-2 border-gray-200 rounded-lg text-sm focus:border-brand-green-700 focus:outline-none transition font-semibold">
              <option value="">—</option>
              <option>😌 Calm</option><option>😎 Confident</option><option>😰 Anxious</option>
              <option>🤑 Greedy</option><option>😱 FOMO</option><option>😤 Revenge</option><option>🥱 Bored</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold mb-1.5 text-brand-green-900 uppercase tracking-wider">Emotion After</label>
            <select name="emotion_after" class="w-full px-4 py-2.5 bg-white border-2 border-gray-200 rounded-lg text-sm focus:border-brand-green-700 focus:outline-none transition font-semibold">
              <option value="">—</option>
              <option>😊 Satisfied</option><option>😔 Regretful</option><option>😤 Frustrated</option>
              <option>💪 Disciplined</option><option>😣 Impatient</option><option>🏆 Proud</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Notes -->
      <div class="glass-card p-5 lg:p-6 reveal-3d" style="animation-delay: 0.2s">
        <div class="flex items-center gap-2 mb-4">
          <div class="icon-premium" style="width:1.75rem;height:1.75rem;border-radius:0.5rem;">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
          </div>
          <p class="text-[10px] uppercase tracking-[0.2em] text-brand-green-700 font-black">Notes</p>
        </div>
        <textarea name="notes" rows="4" placeholder="What did you see? What would you do differently?" class="w-full px-4 py-3 bg-white border-2 border-gray-200 rounded-lg text-sm focus:border-brand-green-700 focus:outline-none transition font-semibold resize-none"></textarea>
      </div>

      <!-- Actions -->
      <div class="flex gap-3 pt-2 reveal-3d" style="animation-delay: 0.25s">
        <button type="submit" class="btn-premium magnetic group flex-1 sm:flex-initial">
          <span>Save Trade</span>
          <span class="text-base transition-transform group-hover:translate-x-1">→</span>
        </button>
        <a href="{{ url_for('journal.list_entries') }}" class="btn-premium-outline magnetic group">
          <span>Cancel</span>
        </a>
      </div>
    </form>
  </div>
</section>

{% endblock %}
