{% extends "base.html" %}
{% block title %}New Post - {{ site_name }}{% endblock %}

{% block content %}
<section class="py-10 mesh-bg min-h-screen">
  <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">
    <h1 class="text-3xl font-extrabold mb-2">New Post</h1>
    <p class="text-gray-600 mb-8">Share setups, wins, losses, or ask the community.</p>

    <form method="POST" class="bg-white border-2 border-brand-green-100 rounded-2xl p-6 space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-1.5">Category</label>
        <select name="category" class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-brand-green-700 focus:outline-none">
          <option value="general">General</option>
          <option value="wins">Wins</option>
          <option value="losses">Losses</option>
          <option value="setups">Setups</option>
          <option value="questions">Questions</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1.5">Title *</label>
        <input type="text" name="title" required minlength="5" class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-brand-green-700 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1.5">Body *</label>
        <textarea name="body" required minlength="10" rows="8" class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-lg focus:border-brand-green-700 focus:outline-none"></textarea>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="submit" class="px-6 py-3 bg-brand-green-800 text-white font-semibold rounded-lg hover:bg-brand-green-900">Post</button>
        <a href="{{ url_for('community.list_posts') }}" class="px-6 py-3 border-2 border-gray-200 text-gray-700 font-semibold rounded-lg hover:bg-gray-50">Cancel</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
