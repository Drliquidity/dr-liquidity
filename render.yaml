databases:
  - name: dr-liquidity-db
    databaseName: drliquidity
    user: drliquidity
    plan: free
    region: oregon

services:
  - type: web
    name: dr-liquidity
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dr-liquidity-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
    autoDeploy: true
